[project]
site_name = "dbt-contracts"
site_description = "Generate and manage dbt projects through Bitol ODCS/ODPS data contracts"
site_author = "Joeri Van Dingenen"
copyright = "Copyright &copy; 2026 Joeri Van Dingenen"
repo_url = "https://github.com/jvdingen/dbt-contracts"

nav = [
    {"Home" = "index.md"},
    {"Getting Started" = "getting-started.md"},
    {"Guides" = [
        {"Writing Contracts" = "contracts.md"},
        {"Data Products" = "products.md"},
        {"Configuration" = "configuration.md"},
    ]},
    {"Reference" = [
        {"CLI" = "cli.md"},
        {"Architecture" = "architecture.md"},
        {"API" = [
            {"Overview" = "api/index.md"},
            {"CLI" = "api/cli.md"},
            {"Configuration" = "api/configuration.md"},
            {"Contracts" = "api/contracts.md"},
            {"Generation" = "api/generation.md"},
        ]},
    ]},
    {"Help" = [
        {"Overview" = "help/index.md"},
        {"Setup" = "help/setup.md"},
        {"Contracts & Products" = "help/contracts-and-products.md"},
        {"Generation" = "help/generation.md"},
        {"Drift & Sync" = "help/drift-and-sync.md"},
        {"Import" = "help/import.md"},
    ]},
]

[project.theme]
language = "en"
icon.logo = "lucide/file-check"
icon.repo = "fontawesome/brands/github"
features = [
    "content.code.copy",
    "content.code.annotate",
    "navigation.footer",
    "navigation.instant",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.suggest",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings]
[project.plugins.mkdocstrings.handlers.python]
options.docstring_style = "google"
options.show_source = true
options.show_root_heading = true
