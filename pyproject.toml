[project]
name = "dbt-contracts"
version = "0.1.0"
description = "Generate and manage dbt projects through Bitol ODCS/ODPS data contracts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Joeri Van Dingenen" },
]
keywords = ["dbt", "data-contracts", "odcs", "odps", "bitol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "click>=8.1.0",
    "datacontract-cli>=0.11.0",
    "open-data-contract-standard>=3.1.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
dbt-contracts = "dbt_contracts.cli:cli"
dbtc = "dbt_contracts.cli:cli"

[project.urls]
Documentation = "https://jvdingen.github.io/dbt-contracts/"
Repository = "https://github.com/jvdingen/dbt-contracts"
Issues = "https://github.com/jvdingen/dbt-contracts/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_contracts"]

[dependency-groups]
dev = [
    "mkdocstrings-python>=2.0.3",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "zensical>=0.0.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["dbt_contracts"]
