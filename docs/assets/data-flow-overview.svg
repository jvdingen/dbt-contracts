<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="df-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- Input: ODCS -->
  <rect x="20" y="20" width="150" height="44" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#0d9488" stroke-width="2"/>
  <text x="95" y="47" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="500">ODCS contracts</text>

  <!-- Input: ODPS -->
  <rect x="20" y="84" width="150" height="44" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#f59e0b" stroke-width="2"/>
  <text x="95" y="111" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="500">ODPS products</text>

  <!-- Merge arrows -->
  <line x1="170" y1="42" x2="230" y2="72" stroke="#0d9488" stroke-width="1.5" marker-end="url(#df-arrow)"/>
  <line x1="170" y1="106" x2="230" y2="76" stroke="#0d9488" stroke-width="1.5" marker-end="url(#df-arrow)"/>

  <!-- Process box -->
  <rect x="232" y="44" width="200" height="60" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#0d9488" stroke-width="2"/>
  <text x="332" y="70" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Validate + Generate</text>
  <text x="332" y="90" text-anchor="middle" fill="#94a3b8" font-size="11">lint, classify, render</text>

  <!-- Output arrow -->
  <line x1="432" y1="74" x2="478" y2="74" stroke="#0d9488" stroke-width="2" marker-end="url(#df-arrow)"/>

  <!-- Output: dbt project -->
  <rect x="480" y="30" width="180" height="88" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#22c55e" stroke-width="2"/>
  <text x="570" y="57" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">dbt Project</text>
  <text x="570" y="77" text-anchor="middle" fill="#94a3b8" font-size="11">models/*.yml</text>
  <text x="570" y="92" text-anchor="middle" fill="#94a3b8" font-size="11">sources/*.yml</text>
  <text x="570" y="107" text-anchor="middle" fill="#94a3b8" font-size="11">stg_*.sql</text>
</svg>
