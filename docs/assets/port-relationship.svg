<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="pr-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Root: DataProduct -->
  <rect x="200" y="15" width="240" height="50" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="45" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">DataProduct (ODPS)</text>

  <!-- Lines from root to children -->
  <line x1="220" y1="65" x2="110" y2="105" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pr-arrow)"/>
  <line x1="320" y1="65" x2="320" y2="105" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pr-arrow)"/>
  <line x1="420" y1="65" x2="530" y2="105" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pr-arrow)"/>

  <!-- Child 1: InputPort -->
  <rect x="10" y="108" width="200" height="46" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#0d9488" stroke-width="2"/>
  <text x="110" y="136" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">InputPort</text>
  <text x="110" y="175" text-anchor="middle" fill="#94a3b8" font-size="11">References ODCS contract</text>
  <text x="110" y="190" text-anchor="middle" fill="#94a3b8" font-size="11">(source data)</text>

  <!-- Child 2: OutputPort -->
  <rect x="220" y="108" width="200" height="46" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#0d9488" stroke-width="2"/>
  <text x="320" y="136" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">OutputPort</text>
  <text x="320" y="175" text-anchor="middle" fill="#94a3b8" font-size="11">References ODCS contract</text>
  <text x="320" y="190" text-anchor="middle" fill="#94a3b8" font-size="11">(exposed data)</text>

  <!-- Child 3: ManagementPort -->
  <rect x="430" y="108" width="200" height="46" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#0d9488" stroke-width="2"/>
  <text x="530" y="136" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">ManagementPort</text>
  <text x="530" y="175" text-anchor="middle" fill="#94a3b8" font-size="11">Observability, control</text>
  <text x="530" y="190" text-anchor="middle" fill="#94a3b8" font-size="11">discovery</text>

  <!-- dbt mapping labels -->
  <text x="110" y="220" text-anchor="middle" fill="#0d9488" font-size="10" font-weight="500">{{ source() }}</text>
  <text x="320" y="220" text-anchor="middle" fill="#0d9488" font-size="10" font-weight="500">{{ ref() }} / {{ source() }}</text>
  <text x="530" y="220" text-anchor="middle" fill="#94a3b8" font-size="10" font-style="italic">monitoring, catalog</text>
</svg>
