<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="ca-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- Layer 1: CLI -->
  <rect x="20" y="15" width="680" height="52" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="38" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="500">CLI</text>
  <text x="360" y="55" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">dbt-contracts (click)</text>

  <!-- Arrow CLI → Core -->
  <line x1="360" y1="67" x2="360" y2="88" stroke="#0d9488" stroke-width="1.5" marker-end="url(#ca-arrow)"/>

  <!-- Layer 2: Core - top row -->
  <rect x="20" y="90" width="680" height="195" rx="10" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="40" y="108" fill="#94a3b8" font-size="11" font-weight="500">Core</text>

  <!-- Discovery -->
  <rect x="40" y="115" width="200" height="60" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#0d9488" stroke-width="1.5"/>
  <text x="140" y="140" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Discovery</text>
  <text x="140" y="158" text-anchor="middle" fill="#94a3b8" font-size="11">Scan and load contracts</text>

  <!-- Validation -->
  <rect x="260" y="115" width="200" height="60" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#0d9488" stroke-width="1.5"/>
  <text x="360" y="140" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Validation</text>
  <text x="360" y="158" text-anchor="middle" fill="#94a3b8" font-size="11">Schema lint, cross-refs</text>

  <!-- Generation -->
  <rect x="480" y="115" width="200" height="60" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#0d9488" stroke-width="1.5"/>
  <text x="580" y="140" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Generation</text>
  <text x="580" y="158" text-anchor="middle" fill="#94a3b8" font-size="11">Post-process and write</text>

  <!-- Core - bottom row -->
  <!-- Differ -->
  <rect x="40" y="190" width="200" height="60" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#0d9488" stroke-width="1.5"/>
  <text x="140" y="215" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Differ</text>
  <text x="140" y="233" text-anchor="middle" fill="#94a3b8" font-size="11">Drift detection</text>

  <!-- Init -->
  <rect x="260" y="190" width="200" height="60" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#0d9488" stroke-width="1.5"/>
  <text x="360" y="215" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Init</text>
  <text x="360" y="233" text-anchor="middle" fill="#94a3b8" font-size="11">Scaffold project</text>

  <!-- Importer -->
  <rect x="480" y="190" width="200" height="60" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#0d9488" stroke-width="1.5"/>
  <text x="580" y="215" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Importer</text>
  <text x="580" y="233" text-anchor="middle" fill="#94a3b8" font-size="11">dbt YAML to ODCS</text>

  <!-- Arrow Core → Adapter -->
  <line x1="360" y1="285" x2="360" y2="305" stroke="#0d9488" stroke-width="1.5" marker-end="url(#ca-arrow)"/>

  <!-- Layer 3: Adapter -->
  <rect x="100" y="308" width="520" height="55" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#0d9488" stroke-width="2"/>
  <text x="360" y="330" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Adapter</text>
  <text x="360" y="350" text-anchor="middle" fill="#94a3b8" font-size="11">lint() / render() / staging SQL  ---  wraps datacontract-cli exporters</text>

  <!-- Arrow Adapter → Models -->
  <line x1="360" y1="363" x2="360" y2="383" stroke="#0d9488" stroke-width="1.5" marker-end="url(#ca-arrow)"/>

  <!-- Layer 4: Models -->
  <rect x="40" y="386" width="200" height="46" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1.5"/>
  <text x="140" y="414" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="500">Config</text>

  <rect x="260" y="386" width="200" height="46" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1.5"/>
  <text x="360" y="414" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="500">ODPS</text>

  <rect x="480" y="386" width="200" height="46" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1.5"/>
  <text x="580" y="414" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="500">ODCS (SDK)</text>

  <text x="40" y="378" fill="#94a3b8" font-size="11" font-weight="500">Models</text>

  <!-- Arrow Models → External -->
  <line x1="360" y1="432" x2="360" y2="452" stroke="#0d9488" stroke-width="1.5" marker-end="url(#ca-arrow)"/>

  <!-- Layer 5: External -->
  <rect x="100" y="455" width="250" height="46" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="225" y="483" text-anchor="middle" fill="#94a3b8" font-size="12">datacontract-cli</text>

  <rect x="370" y="455" width="250" height="46" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="495" y="483" text-anchor="middle" fill="#94a3b8" font-size="12">open-data-contract-standard</text>

  <text x="100" y="448" fill="#94a3b8" font-size="11" font-weight="500">External Libraries</text>
</svg>
