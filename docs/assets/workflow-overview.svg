<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#0d9488"/>
    </marker>
    <marker id="arrow-back" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Step 1: Define -->
  <rect x="20" y="30" width="170" height="80" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#0d9488" stroke-width="2"/>
  <text x="105" y="60" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Define</text>
  <text x="105" y="80" text-anchor="middle" fill="#94a3b8" font-size="11">ODCS contracts</text>
  <text x="105" y="95" text-anchor="middle" fill="#94a3b8" font-size="11">ODPS products</text>

  <!-- Arrow 1→2 -->
  <line x1="190" y1="70" x2="218" y2="70" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Validate -->
  <rect x="220" y="30" width="170" height="80" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#0d9488" stroke-width="2"/>
  <text x="305" y="60" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Validate</text>
  <text x="305" y="80" text-anchor="middle" fill="#94a3b8" font-size="11">Schema lint, cross-refs</text>
  <text x="305" y="95" text-anchor="middle" fill="#94a3b8" font-size="11">Status checks</text>

  <!-- Arrow 2→3 -->
  <line x1="390" y1="70" x2="418" y2="70" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Generate -->
  <rect x="420" y="30" width="170" height="80" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#0d9488" stroke-width="2"/>
  <text x="505" y="60" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Generate</text>
  <text x="505" y="80" text-anchor="middle" fill="#94a3b8" font-size="11">models, sources</text>
  <text x="505" y="95" text-anchor="middle" fill="#94a3b8" font-size="11">staging SQL, tests</text>

  <!-- Arrow 3→4 -->
  <line x1="590" y1="70" x2="618" y2="70" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Maintain -->
  <rect x="620" y="30" width="170" height="80" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#0d9488" stroke-width="2"/>
  <text x="705" y="60" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Maintain</text>
  <text x="705" y="80" text-anchor="middle" fill="#94a3b8" font-size="11">Detect drift</text>
  <text x="705" y="95" text-anchor="middle" fill="#94a3b8" font-size="11">Sync changes</text>

  <!-- CLI labels below boxes -->
  <text x="105" y="132" text-anchor="middle" fill="#0d9488" font-size="11" font-weight="500">init</text>
  <text x="305" y="132" text-anchor="middle" fill="#0d9488" font-size="11" font-weight="500">validate</text>
  <text x="505" y="132" text-anchor="middle" fill="#0d9488" font-size="11" font-weight="500">generate</text>
  <text x="705" y="132" text-anchor="middle" fill="#0d9488" font-size="11" font-weight="500">diff / sync</text>

  <!-- Import reverse arrow -->
  <line x1="620" y1="175" x2="192" y2="175" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-back)"/>
  <text x="405" y="195" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="500">import (reverse: dbt schema → contracts)</text>
</svg>
